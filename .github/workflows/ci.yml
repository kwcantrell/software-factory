name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow calls this one, so a release runs exactly the same checks.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install shellcheck and the Claude Code CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          npm install -g @anthropic-ai/claude-code
          shellcheck --version
          claude --version

      - name: Run every check
        run: scripts/check.sh
