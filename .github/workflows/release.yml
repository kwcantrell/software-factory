name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches plugin version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against plugin.json and CHANGELOG.md
        run: python3 -I scripts/release.py "$GITHUB_REF_NAME" --notes-out "$RUNNER_TEMP/notes.md"

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's release notes
        run: python3 -I scripts/release.py "$GITHUB_REF_NAME" --notes-out "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
