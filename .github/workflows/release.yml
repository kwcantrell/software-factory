name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches plugin version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check the tag against every plugin's version and CHANGELOG.md
        run: npx --yes --offline --loglevel=error --package=./plugins/factory-dev -- factory-dev release "$GITHUB_REF_NAME" --notes-out "$RUNNER_TEMP/notes.md"

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Extract this version's release notes
        run: npx --yes --offline --loglevel=error --package=./plugins/factory-dev -- factory-dev release "$GITHUB_REF_NAME" --notes-out "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
